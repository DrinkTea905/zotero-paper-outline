<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      class="paper-outline-page"
      onload="window.PaperOutlinePrefsUI &amp;&amp; window.PaperOutlinePrefsUI.init()">

  <groupbox>
    <html:header class="paper-outline-hero">
      <html:p class="paper-outline-subtitle">
        自动生成论文总结与带页码的层级目录。首次使用请先连接 AI 服务并完成测试。
      </html:p>
    </html:header>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-ai-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-ai-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">1</html:span>连接 AI 服务
          </html:h2>
          <html:p class="paper-outline-card-desc">选择服务商并填写密钥，测试成功后即可生成内容。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-form-grid">
        <html:label class="paper-outline-form-label" for="paper-outline-provider">服务商</html:label>
        <menulist id="paper-outline-provider"
                  native="true"
                  preference="extensions.paperoutline.provider">
          <menupopup>
            <menuitem value="deepseek" label="DeepSeek（默认）"/>
            <menuitem value="openai" label="OpenAI"/>
            <menuitem value="moonshot" label="月之暗面 Kimi"/>
            <menuitem value="zhipu" label="智谱 GLM"/>
            <menuitem value="qwen" label="通义千问 Qwen"/>
            <menuitem value="siliconflow" label="硅基流动 SiliconFlow"/>
            <menuitem value="ollama" label="本地 Ollama（免 Key）"/>
            <menuitem value="custom" label="自定义服务"/>
          </menupopup>
        </menulist>

        <html:label class="paper-outline-form-label" for="paper-outline-api-key">API Key</html:label>
        <html:div class="paper-outline-field-stack">
          <html:input id="paper-outline-api-key"
                      type="password"
                      autocomplete="off"
                      placeholder="粘贴服务商提供的 API Key"
                      preference="extensions.paperoutline.apiKey"/>
          <html:p id="paper-outline-key-hint" class="paper-outline-hint">仅保存在本机 Zotero 设置中。</html:p>
        </html:div>

        <html:label class="paper-outline-form-label" for="paper-outline-model">模型（可选）</html:label>
        <html:div class="paper-outline-field-stack">
          <html:input id="paper-outline-model"
                      type="text"
                      placeholder="留空自动选择当前可用模型"
                      preference="extensions.paperoutline.model"/>
          <html:p id="paper-outline-model-hint" class="paper-outline-hint">留空时自动查询服务商当前可用模型；查询失败时才使用内置兜底。</html:p>
        </html:div>
      </html:div>

      <html:details id="paper-outline-api-details" class="paper-outline-details">
        <html:summary>自定义接口地址</html:summary>
        <html:div class="paper-outline-details-body paper-outline-form-grid">
          <html:label class="paper-outline-form-label" for="paper-outline-api-url">API URL</html:label>
          <html:div class="paper-outline-field-stack">
            <html:input id="paper-outline-api-url"
                        type="url"
                        placeholder="留空使用服务商默认地址"
                        preference="extensions.paperoutline.apiUrl"/>
            <html:p class="paper-outline-hint">
              自定义服务必填；地址应指向 OpenAI 兼容的 chat/completions 接口。
            </html:p>
          </html:div>
        </html:div>
      </html:details>

      <html:div class="paper-outline-action-row">
        <button id="paper-outline-test-button"
                label="测试连接"
                oncommand="window.PaperOutlinePrefsUI.testConnection()"/>
        <html:span class="paper-outline-cost-note">会发送一次极短请求，可能产生极少量费用。</html:span>
      </html:div>
      <html:div id="paper-outline-test-status"
                class="paper-outline-status paper-outline-status-idle"
                data-state="idle"
                role="status"
                aria-live="polite">尚未测试连接。</html:div>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-auto-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-auto-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">2</html:span>自动处理
          </html:h2>
          <html:p class="paper-outline-card-desc">新文献存入 Zotero 后自动执行；关闭后仍可通过右键手动生成。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-toggle-list">
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-auto-summary"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-auto-summary-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-auto-summary"
                        id="paper-outline-auto-summary-title"
                        class="paper-outline-toggle-title">自动生成论文总结</html:label>
            <html:p class="paper-outline-toggle-desc">保存为当前文献的子笔记，已有总结时自动跳过。</html:p>
          </html:div>
        </html:div>
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-auto-outline"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-auto-outline-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-auto-outline"
                        id="paper-outline-auto-outline-title"
                        class="paper-outline-toggle-title">自动生成层级目录</html:label>
            <html:p class="paper-outline-toggle-desc">缓存在阅读器大纲栏，打开 PDF 即可查看和跳转。</html:p>
          </html:div>
        </html:div>
      </html:div>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-output-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-output-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">3</html:span>生成偏好
          </html:h2>
          <html:p class="paper-outline-card-desc">控制目录的详细程度；提示词模板仅在需要定制时修改。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-form-grid">
        <html:label class="paper-outline-form-label" for="paper-outline-max-level">目录层级</html:label>
        <menulist id="paper-outline-max-level"
                  native="true"
                  preference="extensions.paperoutline.maxLevel">
          <menupopup>
            <menuitem value="0" label="全部层级（默认）"/>
            <menuitem value="1" label="只显示一级标题"/>
            <menuitem value="2" label="显示到二级标题"/>
            <menuitem value="3" label="显示到三级标题"/>
            <menuitem value="4" label="显示到四级标题"/>
          </menupopup>
        </menulist>
      </html:div>

      <html:details class="paper-outline-details">
        <html:summary>提示词模板</html:summary>
        <html:div class="paper-outline-details-body">
          <html:div class="paper-outline-prompt-toolbar">
            <html:p class="paper-outline-hint">可以直接修改；需要重新开始时，可一键恢复目录与总结的内置提示词。</html:p>
            <button id="paper-outline-reset-prompts"
                    label="恢复默认"
                    oncommand="window.PaperOutlinePrefsUI.restoreDefaultPrompts()"/>
          </html:div>
          <html:p id="paper-outline-prompt-reset-status"
                  class="paper-outline-prompt-reset-status"
                  role="status"
                  aria-live="polite"></html:p>
          <html:div class="paper-outline-prompt-block">
            <html:label class="paper-outline-prompt-label" for="paper-outline-outline-prompt">目录提示词</html:label>
            <html:textarea id="paper-outline-outline-prompt"
                           class="paper-outline-prompt"
                           rows="6"
                           preference="extensions.paperoutline.prompt"></html:textarea>
          </html:div>
          <html:div class="paper-outline-prompt-block">
            <html:label class="paper-outline-prompt-label" for="paper-outline-summary-prompt">总结提示词</html:label>
            <html:textarea id="paper-outline-summary-prompt"
                           class="paper-outline-prompt"
                           rows="7"
                           preference="extensions.paperoutline.summaryPrompt"></html:textarea>
          </html:div>
        </html:div>
      </html:details>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-tools-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-tools-heading" class="paper-outline-card-title">实用工具</html:h2>
          <html:p class="paper-outline-card-desc">这些功能不调用 AI，也不会产生接口费用。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-toggle-list">
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-despace-button"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-despace-button-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-despace-button"
                        id="paper-outline-despace-button-title"
                        class="paper-outline-toggle-title">显示“去除文字空格”按钮</html:label>
            <html:p class="paper-outline-toggle-desc">
              在阅读器工具栏显示粉色小猫，一键清理中文 PDF 复制文字和标注中的多余空格；重开阅读器后生效。
            </html:p>
          </html:div>
        </html:div>
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-copy-file"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-copy-file-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-copy-file"
                        id="paper-outline-copy-file-title"
                        class="paper-outline-toggle-title">启用“复制 PDF 文件”</html:label>
            <html:p class="paper-outline-toggle-desc">
              在文库中单选或多选文献，右键或按 Ctrl+C 复制 PDF 文件本身；Windows 支持一次粘贴多份文件。
            </html:p>
          </html:div>
        </html:div>
      </html:div>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-advanced-heading">
      <html:details>
        <html:summary id="paper-outline-advanced-heading" class="paper-outline-card-title">高级设置与数据</html:summary>
        <html:div class="paper-outline-details-body">
          <html:div class="paper-outline-form-grid">
            <html:label class="paper-outline-form-label" for="paper-outline-concurrency">并发数</html:label>
            <html:div class="paper-outline-field-stack">
              <html:input id="paper-outline-concurrency"
                          type="number"
                          min="1"
                          max="50"
                          preference="extensions.paperoutline.concurrency"/>
              <html:p class="paper-outline-hint">请求过于频繁时可适当调低，建议保持默认值 5。</html:p>
            </html:div>

            <html:label class="paper-outline-form-label" for="paper-outline-max-chars">每块字数</html:label>
            <html:div class="paper-outline-field-stack">
              <html:input id="paper-outline-max-chars"
                          type="number"
                          min="2000"
                          max="200000"
                          preference="extensions.paperoutline.maxCharsPerChunk"/>
              <html:p class="paper-outline-hint">长文分块大小，建议保持默认值 40000。</html:p>
            </html:div>
          </html:div>

          <html:div class="paper-outline-toggle-list" style="margin-top:16px;">
            <html:div class="paper-outline-toggle-item">
              <html:input id="paper-outline-save-as-note"
                          class="paper-outline-toggle-control"
                          type="checkbox"
                          aria-labelledby="paper-outline-save-as-note-title"/>
              <html:div class="paper-outline-toggle-copy">
                <html:label for="paper-outline-save-as-note"
                            id="paper-outline-save-as-note-title"
                            class="paper-outline-toggle-title">同时把目录保存为子笔记</html:label>
                <html:p class="paper-outline-toggle-desc">目录已常驻阅读器大纲栏，一般无需开启。</html:p>
              </html:div>
            </html:div>
          </html:div>

          <html:div class="paper-outline-danger-row">
            <html:div>
              <html:p class="paper-outline-toggle-title">目录缓存</html:p>
              <html:p class="paper-outline-toggle-desc">只删除插件生成的目录缓存，不删除 PDF、文献条目或总结笔记。</html:p>
            </html:div>
            <button label="清空目录缓存"
                    oncommand="Zotero.PaperOutlineGPT &amp;&amp; Zotero.PaperOutlineGPT.clearAllCacheUI()"/>
          </html:div>
        </html:div>
      </html:details>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card">
      <html:details>
        <html:summary class="paper-outline-card-title">使用帮助</html:summary>
        <html:div class="paper-outline-help paper-outline-details-body">
          <html:h3>第一次使用</html:h3>
          <html:ol>
            <html:li>选择 AI 服务商，粘贴 API Key；使用本地 Ollama 时无需 Key。</html:li>
            <html:li>点击“测试连接”，看到绿色的“连接成功”后再开始生成。</html:li>
            <html:li>保持“自动处理”开启，之后把带 PDF 的文献存入 Zotero 即可。</html:li>
          </html:ol>

          <html:h3>手动生成</html:h3>
          <html:ul>
            <html:li>文库：选中一篇或多篇文献，右键选择“AI 整篇总结”或“AI 生成目录”。</html:li>
            <html:li>阅读器：打开 PDF，在左侧“大纲”栏点击“生成目录”。</html:li>
          </html:ul>

          <html:h3>没有生成结果？</html:h3>
          <html:ul>
            <html:li>先重新测试连接；错误信息会提示 Key、余额、模型名或接口地址问题。</html:li>
            <html:li>PDF 需要有可提取的文字层；纯扫描件请先 OCR。</html:li>
            <html:li>目录会自动缓存，重新打开同一篇 PDF 时无需重复生成。</html:li>
          </html:ul>
        </html:div>
      </html:details>
    </html:section>
  </groupbox>
</vbox>
