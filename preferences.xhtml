<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      class="paper-outline-page"
      onload="window.PaperOutlinePrefsUI &amp;&amp; window.PaperOutlinePrefsUI.init()">

  <groupbox>
    <html:header class="paper-outline-hero">
      <html:p class="paper-outline-subtitle">
        自动生成论文总结与带页码的层级目录；扫描 PDF 也可在授权后完成文字识别。
      </html:p>
    </html:header>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-ai-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-ai-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">1</html:span>连接 AI 服务
          </html:h2>
          <html:p class="paper-outline-card-desc">选择服务商并填写密钥，测试成功后即可生成内容。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-form-grid">
        <html:label class="paper-outline-form-label" for="paper-outline-provider">服务商</html:label>
        <menulist id="paper-outline-provider"
                  native="true"
                  preference="extensions.paperoutline.provider">
          <menupopup>
            <menuitem value="deepseek" label="DeepSeek（默认）"/>
            <menuitem value="mimo" label="Xiaomi MiMo"/>
            <menuitem value="moonshot" label="月之暗面 Kimi"/>
            <menuitem value="zhipu" label="智谱 GLM"/>
            <menuitem value="qwen" label="通义千问 Qwen"/>
            <menuitem value="siliconflow" label="硅基流动 SiliconFlow"/>
            <menuitem value="ollama" label="本地 Ollama（免 Key）"/>
            <menuitem value="custom" label="自定义服务"/>
          </menupopup>
        </menulist>

        <html:label class="paper-outline-form-label" for="paper-outline-api-key">API Key</html:label>
        <html:div class="paper-outline-field-stack">
          <html:div class="paper-outline-secret-row">
            <html:input id="paper-outline-api-key"
                        type="password"
                        autocomplete="off"
                        placeholder="粘贴服务商提供的 API Key"/>
            <html:button id="po-api-key-toggle"
                         type="button"
                         class="paper-outline-secret-toggle"
                         aria-pressed="false"
                         title="显示或隐藏 API Key">显示</html:button>
          </html:div>
          <html:p id="paper-outline-key-hint" class="paper-outline-hint">按服务商分别保存在本机 Zotero 设置中。</html:p>
        </html:div>

        <html:label class="paper-outline-form-label" for="paper-outline-model">模型（可选）</html:label>
        <html:div class="paper-outline-field-stack">
          <html:div class="paper-outline-input-action-row">
            <html:input id="paper-outline-model"
                        type="text"
                        placeholder="留空 = 自动获取当前服务商最新推荐模型（升级不失效）"/>
            <button id="po-fetch-models-btn"
                    label="拉取模型"
                    oncommand="window.PaperOutlinePrefsUI.fetchModels()"/>
          </html:div>
          <html:p id="po-model-fetch-status"
                  class="paper-outline-fetch-status"
                  data-state="idle"
                  role="status"
                  aria-live="polite"
                  hidden="hidden"></html:p>
          <menulist id="po-model-picker"
                    native="true"
                    class="paper-outline-model-picker"
                    hidden="true"
                    aria-label="服务商可用模型列表">
            <menupopup/>
          </menulist>
          <html:p id="paper-outline-model-hint" class="paper-outline-hint">留空 = 自动获取当前服务商最新推荐模型（升级不失效）；也可点击右侧「拉取模型」手动选择。</html:p>
        </html:div>

        <html:span class="paper-outline-form-label">深度思考</html:span>
        <html:div id="paper-outline-deep-thinking-row" class="paper-outline-toggle-item paper-outline-inline-toggle">
          <html:input id="paper-outline-deep-thinking"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-deep-thinking-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-deep-thinking"
                        id="paper-outline-deep-thinking-title"
                        class="paper-outline-toggle-title">启用深度思考</html:label>
            <html:p id="paper-outline-deep-thinking-desc" class="paper-outline-toggle-desc">默认关闭；仅对声明支持该参数的内置服务商生效。</html:p>
          </html:div>
        </html:div>
      </html:div>

      <html:details id="paper-outline-api-details" class="paper-outline-details">
        <html:summary>自定义接口地址</html:summary>
        <html:div class="paper-outline-details-body paper-outline-form-grid">
          <html:label class="paper-outline-form-label" for="paper-outline-api-url">API URL</html:label>
          <html:div class="paper-outline-field-stack">
            <html:input id="paper-outline-api-url"
                        type="url"
                        placeholder="留空使用服务商默认地址"/>
            <html:p class="paper-outline-hint">
              自定义服务必填；地址应指向 OpenAI 兼容的 chat/completions 接口。
            </html:p>
          </html:div>
        </html:div>
      </html:details>

      <html:div class="paper-outline-action-row">
        <button id="paper-outline-test-button"
                label="测试连接"
                oncommand="window.PaperOutlinePrefsUI.testConnection()"/>
        <html:span class="paper-outline-cost-note">会发送一次极短请求，可能产生极少量费用。</html:span>
      </html:div>
      <html:div id="paper-outline-test-status"
                class="paper-outline-status paper-outline-status-idle"
                data-state="idle"
                role="status"
                aria-live="polite">尚未测试连接。</html:div>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section id="paper-outline-mineru-card"
                  class="paper-outline-card"
                  aria-labelledby="paper-outline-mineru-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-mineru-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">2</html:span>识别扫描 PDF
          </html:h2>
          <html:p class="paper-outline-card-desc">
            有些扫描论文只有页面图片，Paper Outline 看不到里面的文字。MinerU 可以先把这些页面识别成可阅读的文字，再继续生成总结和目录。
          </html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-mineru-note">
        <html:strong>什么时候会用到？</html:strong>
        只有 PDF 没有可读取的文字时才会使用 MinerU；普通 PDF 不会上传。
      </html:div>

      <html:div class="paper-outline-form-grid paper-outline-mineru-form">
        <html:label class="paper-outline-form-label" for="paper-outline-mineru-token">MinerU Token</html:label>
        <html:div class="paper-outline-field-stack">
          <html:div class="paper-outline-secret-row">
            <html:input id="paper-outline-mineru-token"
                        type="password"
                        autocomplete="off"
                        placeholder="粘贴从 MinerU 获取的 Token"
                        preference="extensions.paperoutline.mineruToken"/>
            <html:button id="po-mineru-token-toggle"
                         type="button"
                         class="paper-outline-secret-toggle"
                         aria-pressed="false"
                         title="显示或隐藏 MinerU Token">显示</html:button>
          </html:div>
          <html:p class="paper-outline-hint">
            仅保存在本机 Zotero 设置中。MinerU Token 有效期为 90 天，到期后需要重新创建。
          </html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-action-row paper-outline-mineru-actions">
        <button id="paper-outline-mineru-test-button"
                label="检查连接"
                oncommand="window.PaperOutlinePrefsUI.testMineruConnection()"/>
        <button id="paper-outline-mineru-open-button"
                class="paper-outline-link-button"
                label="获取 MinerU Token ↗"
                oncommand="window.PaperOutlinePrefsUI.openMineruTokenPage()"/>
      </html:div>
      <html:div id="paper-outline-mineru-status"
                class="paper-outline-status paper-outline-status-idle"
                data-state="idle"
                role="status"
                aria-live="polite">尚未设置 MinerU。扫描 PDF 暂时无法生成总结和目录。</html:div>

      <html:div class="paper-outline-toggle-list paper-outline-mineru-toggle">
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-mineru-auto-upload"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-mineru-auto-upload-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-mineru-auto-upload"
                        id="paper-outline-mineru-auto-upload-title"
                        class="paper-outline-toggle-title">扫描件默认上传至 MinerU 识别</html:label>
            <html:p class="paper-outline-toggle-desc">
              开启后，遇到没有文字层的 PDF 会自动上传识别；关闭后，每次上传前都会征求确认。
            </html:p>
          </html:div>
        </html:div>
      </html:div>

      <html:p class="paper-outline-mineru-privacy">
        使用 MinerU 时，当前扫描 PDF 会发送至 MinerU 完成文字识别，识别结果随后用于生成总结和目录。
      </html:p>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-auto-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-auto-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">3</html:span>自动处理
          </html:h2>
          <html:p class="paper-outline-card-desc">新文献存入 Zotero 后自动执行；关闭后仍可通过右键手动生成。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-toggle-list">
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-auto-summary"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-auto-summary-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-auto-summary"
                        id="paper-outline-auto-summary-title"
                        class="paper-outline-toggle-title">自动生成论文总结</html:label>
            <html:p class="paper-outline-toggle-desc">保存为当前文献的子笔记，已有总结时自动跳过。</html:p>
          </html:div>
        </html:div>
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-auto-outline"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-auto-outline-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-auto-outline"
                        id="paper-outline-auto-outline-title"
                        class="paper-outline-toggle-title">自动生成层级目录</html:label>
            <html:p class="paper-outline-toggle-desc">缓存在阅读器大纲栏，打开 PDF 即可查看和跳转。</html:p>
          </html:div>
        </html:div>
      </html:div>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-output-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-output-heading" class="paper-outline-card-title">
            <html:span class="paper-outline-step">4</html:span>生成偏好
          </html:h2>
          <html:p class="paper-outline-card-desc">控制目录的详细程度与总结风格；提示词模板可按学科预设切换或自由定制。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-form-grid">
        <html:label class="paper-outline-form-label" for="paper-outline-max-level">目录层级</html:label>
        <menulist id="paper-outline-max-level"
                  native="true"
                  preference="extensions.paperoutline.maxLevel">
          <menupopup>
            <menuitem value="0" label="全部层级（默认）"/>
            <menuitem value="1" label="只显示一级标题"/>
            <menuitem value="2" label="显示到二级标题"/>
            <menuitem value="3" label="显示到三级标题"/>
            <menuitem value="4" label="显示到四级标题"/>
          </menupopup>
        </menulist>
      </html:div>

      <html:details class="paper-outline-details">
        <html:summary>提示词模板</html:summary>
        <html:div class="paper-outline-details-body">
          <html:div class="paper-outline-prompt-toolbar">
            <html:p class="paper-outline-hint">可以直接修改；点击「恢复默认」将恢复目录默认提示词，并按当前所选预设恢复总结提示词。</html:p>
            <button id="paper-outline-reset-prompts"
                    label="恢复默认"
                    oncommand="window.PaperOutlinePrefsUI.restoreDefaultPrompts()"/>
          </html:div>
          <html:p id="paper-outline-prompt-reset-status"
                  class="paper-outline-prompt-reset-status"
                  role="status"
                  aria-live="polite"></html:p>
          <html:div class="paper-outline-prompt-block">
            <html:label class="paper-outline-prompt-label" for="paper-outline-outline-prompt">目录提示词</html:label>
            <html:textarea id="paper-outline-outline-prompt"
                           class="paper-outline-prompt"
                           rows="6"
                           preference="extensions.paperoutline.prompt"></html:textarea>
          </html:div>
          <html:div class="paper-outline-prompt-block">
            <html:div class="paper-outline-preset-row">
              <html:label class="paper-outline-prompt-label paper-outline-preset-label" for="po-summary-preset">总结模板预设</html:label>
              <menulist id="po-summary-preset"
                        native="true"
                        preference="extensions.paperoutline.summaryPreset">
                <menupopup>
                  <menuitem value="general" label="通用学术"/>
                  <menuitem value="humanities" label="人文社科 / 法史（经典）"/>
                  <menuitem value="stem" label="理工 / 实验实证"/>
                  <menuitem value="brief" label="极简速览"/>
                </menupopup>
              </menulist>
            </html:div>
            <html:label class="paper-outline-prompt-label" for="paper-outline-summary-prompt">总结提示词</html:label>
            <html:textarea id="paper-outline-summary-prompt"
                           class="paper-outline-prompt"
                           rows="7"
                           preference="extensions.paperoutline.summaryPrompt"></html:textarea>
          </html:div>
        </html:div>
      </html:details>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-tools-heading">
      <html:div class="paper-outline-card-header">
        <html:div>
          <html:h2 id="paper-outline-tools-heading" class="paper-outline-card-title">实用工具</html:h2>
          <html:p class="paper-outline-card-desc">这些功能不调用 AI，也不会产生接口费用。</html:p>
        </html:div>
      </html:div>

      <html:div class="paper-outline-toggle-list">
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-despace-button"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-despace-button-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-despace-button"
                        id="paper-outline-despace-button-title"
                        class="paper-outline-toggle-title">显示“去除文字空格”按钮</html:label>
            <html:p class="paper-outline-toggle-desc">
              在阅读器工具栏显示粉色小猫，一键清理中文 PDF 复制文字和标注中的多余空格；重开阅读器后生效。
            </html:p>
          </html:div>
        </html:div>
        <html:div class="paper-outline-toggle-item">
          <html:input id="paper-outline-copy-file"
                      class="paper-outline-toggle-control"
                      type="checkbox"
                      aria-labelledby="paper-outline-copy-file-title"/>
          <html:div class="paper-outline-toggle-copy">
            <html:label for="paper-outline-copy-file"
                        id="paper-outline-copy-file-title"
                        class="paper-outline-toggle-title">启用“复制 PDF 文件”</html:label>
            <html:p class="paper-outline-toggle-desc">
              在文库中单选或多选文献，右键或按 Ctrl+C 复制 PDF 文件本身；Windows 支持一次粘贴多份文件。
            </html:p>
          </html:div>
        </html:div>
      </html:div>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card" aria-labelledby="paper-outline-advanced-heading">
      <html:details>
        <html:summary id="paper-outline-advanced-heading" class="paper-outline-card-title">高级设置与数据</html:summary>
        <html:div class="paper-outline-details-body">
          <html:div class="paper-outline-form-grid">
            <html:label class="paper-outline-form-label" for="paper-outline-concurrency">并发数</html:label>
            <html:div class="paper-outline-field-stack">
              <html:input id="paper-outline-concurrency"
                          type="number"
                          min="1"
                          max="50"
                          preference="extensions.paperoutline.concurrency"/>
              <html:p class="paper-outline-hint">请求过于频繁时可适当调低，建议保持默认值 5。</html:p>
            </html:div>

            <html:label class="paper-outline-form-label" for="paper-outline-max-chars">每块字数</html:label>
            <html:div class="paper-outline-field-stack">
              <html:input id="paper-outline-max-chars"
                          type="number"
                          min="2000"
                          max="200000"
                          preference="extensions.paperoutline.maxCharsPerChunk"/>
              <html:p class="paper-outline-hint">长文分块大小，建议保持默认值 40000。</html:p>
            </html:div>
          </html:div>

          <html:div class="paper-outline-toggle-list paper-outline-advanced-toggles">
            <html:div class="paper-outline-toggle-item">
              <html:input id="paper-outline-trim-references"
                          class="paper-outline-toggle-control"
                          type="checkbox"
                          aria-labelledby="paper-outline-trim-references-title"/>
              <html:div class="paper-outline-toggle-copy">
                <html:label for="paper-outline-trim-references"
                            id="paper-outline-trim-references-title"
                            class="paper-outline-toggle-title">AI 处理前自动裁掉文末参考文献（省 Token）</html:label>
                <html:p class="paper-outline-toggle-desc">自动识别并裁去文末参考文献列表，降低费用并让更多正文进入上下文窗口。</html:p>
              </html:div>
            </html:div>
            <html:div class="paper-outline-toggle-item">
              <html:input id="paper-outline-save-as-note"
                          class="paper-outline-toggle-control"
                          type="checkbox"
                          aria-labelledby="paper-outline-save-as-note-title"/>
              <html:div class="paper-outline-toggle-copy">
                <html:label for="paper-outline-save-as-note"
                            id="paper-outline-save-as-note-title"
                            class="paper-outline-toggle-title">同时把目录保存为子笔记</html:label>
                <html:p class="paper-outline-toggle-desc">目录已常驻阅读器大纲栏，一般无需开启。</html:p>
              </html:div>
            </html:div>
          </html:div>

          <html:div class="paper-outline-danger-row">
            <html:div>
              <html:p class="paper-outline-toggle-title">本地缓存</html:p>
              <html:p class="paper-outline-toggle-desc">只删除插件生成的目录或扫描 OCR 缓存，不删除 PDF、文献条目或总结笔记。</html:p>
            </html:div>
            <html:div class="paper-outline-danger-actions">
              <button label="清空目录缓存"
                      oncommand="Zotero.PaperOutlineGPT &amp;&amp; Zotero.PaperOutlineGPT.clearAllCacheUI()"/>
              <button id="po-clear-mineru-cache-btn"
                      label="清除扫描 OCR 缓存"
                      oncommand="window.PaperOutlinePrefsUI.clearMineruCache()"/>
            </html:div>
          </html:div>
        </html:div>
      </html:details>
    </html:section>
  </groupbox>

  <groupbox>
    <html:section class="paper-outline-card">
      <html:details>
        <html:summary class="paper-outline-card-title">使用帮助</html:summary>
        <html:div class="paper-outline-help paper-outline-details-body">
          <html:h3>第一次使用与模型选择</html:h3>
          <html:ol>
            <html:li>选择国内主力 AI 服务商（默认 DeepSeek）或本地 Ollama / 自定义服务，粘贴 API Key；每个服务商的密钥、接口地址和模型都会独立保存，切换时自动恢复。</html:li>
            <html:li><html:strong>自动追新与拉取模型</html:strong>：模型输入框留空即可自动获取当前服务商最新推荐模型，官方升级模型名不会失效；也可点击右侧「拉取模型」实时拉取列表并手动挑选。</html:li>
            <html:li><html:strong>深度思考开关</html:strong>：默认关闭；对支持该参数的内置服务商开启后，总结与目录分析更深入，耗时也会略微增加。</html:li>
            <html:li>点击「测试连接」，看到绿色的「连接成功」即可开始生成；扫描 PDF 可在卡片 2 设置 MinerU Token。</html:li>
          </html:ol>

          <html:h3>生成、模板与阅读器功能</html:h3>
          <html:ul>
            <html:li><html:strong>自动与手动生成</html:strong>：保持「自动处理」开启，文献入库自动生成；也可在文库中右键选择「AI 整篇总结」或「AI 生成目录」，或在阅读器左侧大纲栏手动触发。</html:li>
            <html:li><html:strong>多学科总结模板</html:strong>：在「生成偏好 → 提示词模板」中可一键切换通用学术、人文社科 / 法史、理工 / 实验实证、极简速览 4 套预设。</html:li>
            <html:li><html:strong>大纲摘要展开与顶部快捷工具</html:strong>：阅读器大纲栏支持点击展开/收起各章节核心摘要；顶部工具栏支持一键复制文献信息、复制 PDF 文件及清理中文复制空格。</html:li>
            <html:li><html:strong>重新唤起 Paper Outline</html:strong>：若阅读器切换标签后大纲栏或工具按钮未出现，可在 Zotero 顶部「工具」菜单或阅读器「视图」菜单点击「重新唤起 Paper Outline」。</html:li>
          </html:ul>

          <html:h3>没有生成结果？</html:h3>
          <html:ul>
            <html:li>先点击「测试连接」排查密钥、余额、模型名或接口地址；若原手动填写的模型名下线，清空模型栏即可恢复自动追新。</html:li>
            <html:li>扫描 PDF 没有可读取的文字层；配置 MinerU 后，插件会先识别文字并缓存 OCR 结果，后续重新生成无需重复上传。</html:li>
            <html:li>MinerU Token 有效期为 90 天；插件会记录保存时间，并在临近到期时提醒更换。</html:li>
            <html:li>目录会自动缓存，重新打开同一篇 PDF 时无需重复生成。</html:li>
          </html:ul>

          <html:h3>提示“无法连接 MinerU 结果服务器”？</html:h3>
          <html:ul>
            <html:li>多数用户无需进行额外设置；只有出现这条提示时，才需要检查当前网络。</html:li>
            <html:li>如果正在使用代理、VPN 或网络加速工具，可先暂时关闭后重试。关闭后恢复正常，通常说明识别结果的下载地址被代理影响。</html:li>
            <html:li>请在所用工具的“直连”“绕过代理”或“排除列表”中加入 <html:code>cdn-mineru.openxlab.org.cn</html:code>。</html:li>
            <html:li>使用 Clash 时，可添加规则 <html:code>DOMAIN,cdn-mineru.openxlab.org.cn,DIRECT</html:code>，并使用“规则”模式；其他工具请使用含义相同的直连设置。</html:li>
            <html:li>没有使用代理仍然失败时，可稍后重试、切换网络，或检查安全软件是否限制 Zotero 联网。</html:li>
          </html:ul>
        </html:div>
      </html:details>
    </html:section>
